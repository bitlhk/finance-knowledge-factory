[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-core-m0"
version = "0.1.0"
description = "Isolated Knowledge Core M0 contracts and safety reference"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.10.3"]

[tool.setuptools.packages.find]
include = ["knowledge_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
