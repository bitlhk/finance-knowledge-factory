# Include in the existing zhishi server {}. Keep existing TLS/proxy/write-denial rules.
limit_req zone=kf_archive_per_ip burst=10 nodelay;
limit_req_status 429;
# Suppress native rate-limit error messages (they contain the request URI).
limit_req_log_level info;
error_log /var/log/nginx/kf-archive-error.log warn;
access_log /var/log/nginx/kf-archive-limit.log kf_archive_limit if=$kf_archive_rejected;
# Verify no other access_log at this or child location level records query strings.
# Existing location-level limit_req overrides server inheritance: inspect nginx -T.
