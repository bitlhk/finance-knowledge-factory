# Include in http {}, not server {}. Empty keys bypass the archive budget.
# Use the transport peer IP; do not trust arbitrary X-Forwarded-For.
# Behind a trusted edge, configure real_ip only for explicitly trusted CIDRs.
map "$request_method:$uri" $kf_archive_client {
    default "";
    ~^(GET|HEAD):/api/published-products(/|$) $binary_remote_addr;
}
limit_req_zone $kf_archive_client zone=kf_archive_per_ip:10m rate=30r/m;

map $limit_req_status $kf_archive_rejected {
    default 0;
    REJECTED 1;
}
# Count rejected requests without client identifiers, URI, args, bodies or credentials.
log_format kf_archive_limit escape=json
    '{"time":"$time_iso8601","event":"archive_read_limited","status":$status}';
