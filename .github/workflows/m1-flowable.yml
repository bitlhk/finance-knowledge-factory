name: M1 Flowable real engine probes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flowable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-test.txt
      - name: AST, pinned versions, faults and same-engine recovery
        run: python -m probes.flowable.run
      - name: Retained model output to actual DMN (no model calls)
        run: python -m probes.flowable.run --request evidence/m1-round2/linked-engine-request.json
      - name: Real-source bounded condition (retained output, no model calls)
        run: python -m probes.flowable.run --request evidence/m1-round3/policy/bounded-fields/engine-request.json
      - name: Failed extraction preserves report when every case is guarded
        run: python -m probes.flowable.replay_guarded
      - name: Verified template numeric proof only (not whole-clause acceptance)
        run: python -m probes.flowable.run --request evidence/m1-verified-lowering/addendum/engine-request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flowable-probe-evidence
          path: .m1-local/flowable/
          include-hidden-files: true
          retention-days: 14
