name: Public workbench browser boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: npm install --prefix /tmp/kf-browser --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: /tmp/kf-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/public-workbench-browser.cjs
        env:
          NODE_PATH: /tmp/kf-browser/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-workbench-browser
          path: browser-evidence/
          retention-days: 14
