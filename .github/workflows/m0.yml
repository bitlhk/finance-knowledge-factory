name: Core, document Runtime and isolated workspace regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check exported schemas
        run: |
          python -m knowledge_core.contracts
          git diff --exit-code -- contracts
      - name: Run Core, document, Runtime and isolated UI regression
        run: python -m pytest -q
      - name: Run synthetic lifecycle walkthrough
        run: python -m examples.m0_smoke
