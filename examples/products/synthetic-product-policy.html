<h1>合成产品适用性制度</h1>
<p>仅用于隔离工程测试，不是银行制度，不构成投资建议或业务授权。</p>
<p>第一条 客户风险承受等级和风险评估有效状态必须从客户管理服务取得。历史对话摘要和模型推断不能代替当前客户事实。</p>
<p>第二条 产品风险等级和当前可售状态必须从产品服务取得。本制度不提供任何客户的实时资料、具体产品数据或持仓事实。</p>
<p>第三条 只有客户风险承受等级不低于产品风险等级、客户风险评估有效且产品当前可售时，才能形成合成匹配建议。缺少任一依据时应标记待核实，不得编造缺失事实。本知识服务不执行交易、自动审批或规则核验。</p>
