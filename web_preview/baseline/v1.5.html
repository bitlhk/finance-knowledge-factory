function runService(){const p=P(),rel=resolveRelease(p,app.bizDate),c=p.candidate;const id=uid('KQ');let out={id,release:rel?.id||'—',mode:app.mode,status:'',title:'',detail:'',evidence:'—',ok:false};
 if(app.mode==='history'){if(app.role==='guest'||!(p.recipe.delivery.historyRoles||[]).includes(app.role)){Object.assign(out,{status:'HISTORY_ACCESS_DENIED',title:'历史查看权限拒绝',detail:'历史回放需要单独的读取授权，不等于拥有当前知识检索权限。',release:'—'});app.result=out;render();return}let h=p.archive.find(x=>x.id===app.historyId);if(!h){Object.assign(out,{status:'NOT_FOUND',title:'没有选定的历史记录',detail:'历史回放必须绑定不可变运行记录。'})}else{Object.assign(out,{status:'HISTORY_READ',title:'读取已归档执行结果',detail:`当时结果：${h.title}；日期 ${h.businessDate}；输入成立日 ${h.subject}。该结果来自已存储记录，没有用当前规则重新计算。`,release:h.release,evidence:h.evidence,ok:true})}app.result=out;render();return}

 if(app.mode==='sandbox'){if(!c?.sandbox||app.role!=='tester'){Object.assign(out,{status:'SANDBOX_DENIED',title:'候选环境访问拒绝',detail:'候选仅对已授权测试身份开放，不进入正式服务解析。'})}else{const rule=c.assets.rule?.find(x=>x.kind==='age'),testResult=rule?app.industry==='special'?'REVIEW_REQUIRED':evalRule(rule,'2024-05-01',app.bizDate):'NO_RULE';Object.assign(out,{status:'TEST_ONLY',title:'候选隔离测试（非正式结果）',detail:`候选摘要 ${c.hash}；${rule?'规则模拟计算 '+testResult+'，客户成立日 2024-05-01':'条款证据 '+c.assets.evidence.length+' 项'}。仅供测试，不得用于业务自动判断。`,release:c.cid,evidence:rule?rule.source.src+' '+rule.source.v:c.assets.evidence?.[0]?.id||'—',ok:true})}app.result=out;render();return}
 if(app.op==='source'){const ref=p.recipe.refs[0],src=S(ref?.sid),vv=sourceVersionForDate(src,app.bizDate);if(!vv){Object.assign(out,{status:'SOURCE_NOT_EFFECTIVE',title:'不存在当时已生效的原文',detail:'来源版本尚未生效。'})}else{Object.assign(out,{status:'SOURCE_READ',title:'授权读取权威来源',detail:vv.content.slice(0,135),release:'直接来源读取（不代表索引已发布）',evidence:src.title+' '+vv.v,ok:true})}}
 else if(!rel){Object.assign(out,{status:'NO_RELEASE',title:'没有正式发布的知识服务',detail:'候选产物不能被正式服务隐式消费。'})}
 else if(!sourceAvailability(p,rel,app.bizDate)){Object.assign(out,{status:'RELEASE_INAPPLICABLE',title:'知识版本不适用于当前业务日期',detail:'来源制度有效版本与发布快照不一致。受影响的自动判断或索引不得继续沿用旧版本。允许按来源权限查看原文。'})}
 else if(app.op==='search'){let x=rel.manifest.assets.evidence?.[0];Object.assign(out,{status:x?'EVIDENCE_FOUND':'EVIDENCE_NOT_FOUND',title:x?'命中已发布证据':'未检索到已发布条款',detail:x?x.text:'当前快照无对应证据',evidence:x?x.src+' '+x.v+' / 行'+x.line:'—',ok:!!x})}
 else if(app.op==='facts'){let fs=rel.manifest.assets.facts||[],x=fs[0];Object.assign(out,{status:x?'FACT_FOUND':'NO_FACT',title:x?'取得结构化事实':'没有可查询事实',detail:x?`${x.entity}：${x.attr} = ${x.value}${x.unit}。仅为条款抽取示例，不代表已查询实时产品系统。`:'缺少事实资产',evidence:x?x.source.src+' '+x.source.v:'—',ok:!!x})}

recipeCheck=function(p,w){if(!w.refs.length)return'尚未绑定来源；请从原料库选择或上传';if(w.refs.some(r=>!S(r.sid)||!V(r.sid,r.version)))return'来源固定版本不存在';if(w.refs.some(r=>S(r.sid).parsePending))return'原料尚未解析或接口未连接，不能在离线原型里假装已经加工';if(!w.lines.length)return'未选择可生产的知识产物';if(w.lines.some(k=>!canEditLine(k)))return'包含未接入的加工器';if(w.lines.includes('rule')&&!w.lines.includes('evidence'))return'规则要求有原文证据';if(!confirmedTests(p,'evidence').length&&w.lines.includes('evidence'))return'缺少已确认的证据测试集；可在验证配置中导入';if(w.lines.includes('rule')&&(!w.quality.needGold||!w.quality.requireScope||!Object.values(p.gold).some(a=>a.length)))return'规则缺少独立人工金标或必须的例外门禁';if(w.lines.includes('facts')&&!confirmedTests(p,'facts').length)return'事实属性工艺缺少已确认的字段/单位测试';if(!w.delivery.roles.length)return'未声明允许使用知识服务的角色';if(w.delivery.roles.some(role=>!w.refs.every(ref=>S(ref.sid)?.roles.includes(role))))return'交付角色超出来源授权上限';if((w.delivery.historyRoles||[]).some(role=>!w.refs.every(ref=>S(ref.sid)?.roles.includes(role))))return'历史查看权限超出来源授权上限';ensureSettings(w);if(w.settings.common.parser!=='demo'||(w.lines.includes('evidence')&&(w.settings.evidence.index!=='demo-hybrid'||w.settings.evidence.rerank!=='demo'))||(w.lines.includes('rule')&&(w.settings.rule.extract!=='demo'||w.settings.rule.executor!=='demo'))||(w.lines.includes('facts')&&w.settings.facts.mapping!=='demo'))return'存在尚未连接的真实组件；当前离线原型不可模拟其执行成功';return null};
verStates=function(p,c){const checks=legacyVerStatesV13(p,c);if(p.recipe.lines.includes('evidence')){const tt=confirmedTests(p,'evidence');const ok=tt.length>0&&tt.every(t=>c.assets.evidence.some(x=>x.text.includes(t.expected)&&((x.text.includes(t.query))||(t.query?.length<3))));if(checks.evidence){checks.evidence.checks.push(['已确认独立证据测试集 '+tt.length+' 条',ok]);if(!ok)checks.evidence.status='fail';}}

 if(/工单|案例|经验|历史处置|投诉|调查|相似/.test(goal))add('case','业务希望参考历史处理，必须要求已办结记录及处置结果证据。');
 if(!keys.length)add('evidence','目标尚不明确，建议先以可验证的来源证据作为最低交付。');
 if(/应|必须|不得|不超过|应满|仅限|除外|专项/.test(snippets)&&!keys.includes('rule'))need.push('抽样中出现条件/例外词，但业务目标没有明确规则消费需求：请确认是否需要规则产物。');
 if(keys.includes('rule')&&!keys.includes('evidence')){add('evidence','规则需关联来源条款作为证据。')}
 if(keys.includes('case')&&!/工单|处置|报告|结果|案例/.test(snippets))need.push('没有识别到已办结案例及结果依据；案例工艺不可仅凭制度文本推定。');
 if(keys.includes('facts'))need.push('核对实体标识、属性 Schema、单位及权威来源；不要以 LLM 生成事实替代权威系统。');
 const unavailable=keys.filter(k=>['method','case'].includes(k));if(unavailable.length)need.push(`工艺 ${unavailable.map(k=>craftByKeyV15(k).title).join('、')} 尚未接入，只能保存规划，不能执行或发布。`);
 return {keys,why,need,sourceCount:w.refs.length,sourceNames:w.refs.map(r=>S(r.sid)?.title||r.sid)};
}
const originalRecipeModalV14=recipeModalV14;
recipeModalV14=function(){let h=originalRecipeModalV14();if(app.wstep===0){const button=`<div class="v15-setup"><b>智能配方建议</b> · 基于业务目标、原料类型与抽样条款匹配已准入工艺目录。<button class="btn secondary sm" style="margin-left:8px" data-v15="recommend">分析并推荐工艺 →</button><div class="v15-note">离线原型使用可解释的启发式规则，并未调用真正的 AI 模型。</div></div>`;h=h.replace('<div class="hint" style="margin-top:10px">原料库登记一次',button+'<div class="hint" style="margin-top:10px">原料库登记一次')}
 if(app.wstep===1){const w=app.wizard;const rec=app.recommendation?.productId===P().id?app.recommendation:null;
 let summary=`<div class="v15-setup"><b>产线技术目录</b>：文档知识 RAGFlow / Docling；事实关系 OpenSPG / Graphiti；业务规则 Rule IR / Flowable DMN；流程方法 Agent Skills / BPMN；案例经验 CBRkit。<button class="btn secondary sm" style="margin-left:8px" data-v15="catalog">查看每条工序</button></div>`;
 if(rec){summary+=`<div class="v15-rec"><div class="v15-rec-head"><b>针对当前业务的工艺建议</b>${badge('待人工确认','gold')}</div><div class="v15-rec-grid">${rec.keys.map(k=>`<div class="v15-rec-item"><b>${E(craftByKeyV15(k).title)}</b> · ${E(craftStageV15(k))}<p>${E(rec.why[k])}</p></div>`).join('')}</div><div class="v15-note" style="margin:9px 0">${E(rec.need.join('；')||'请人工核对来源、目标产物和验证集。')}</div><button class="btn sm" data-v15="apply-rec">采用推荐组合（仍需手工审核）</button> <button class="btn secondary sm" data-v15="dismiss-rec">保留当前选择</button></div>`}
 h=h.replace('<div class="small" style="font-weight:800;margin-bottom:9px">选择专业生产工艺</div>',summary+'<div class="small" style="font-weight:800;margin-bottom:9px">选择五种专业生产工艺</div>');
 h=h.replace('<details class="v14-planned"><summary>规划工艺 · 当前不可运行（流程方法 / 案例经验 / 事件时序）</summary><div class="sub">这三类仅保留标准输入、资产和服务契约，未连接真实加工器前不能选择并声称执行成功。</div></details>',`<details class="v14-planned" open><summary>流程方法 / 案例经验 · 第二批规划工艺</summary><div class="v15-plancards">${['method','case'].map(k=>{const c=craftByKeyV15(k);return `<label class="v15-plancard"><span><b>${E(c.title)}</b><small>${E(c.primary)}</small><small>${E(c.output)}</small></span><input type="checkbox" name="w-line" value="${k}" ${w.lines.includes(k)?'checked':''}></label>`}).join('')}</div><p class="v15-note">可以保存规划配方，但当前离线原型缺真实加工与验证组件，不能运行、审批或发布。事件模式与实时交易计算由规则工艺及既有数据平台协同。</p></details>`);
 h=h.replace('<div class="hint">工序的输入输出必须满足合同；组件未接入时配置可保存为草稿，但不能标成可运行生产配置。</div>',`<div class="hint">选择开源组件不等于已经接线。已接入的离线示例可以跑；目标组件可存为规划配方，正式构建前必须完成接口、权限、金标与组件版本检查。</div>`);
 h=h.replace('证据索引工艺','文档知识工艺').replace('规则决策工艺','业务规则工艺').replace('事实属性工艺','事实关系工艺（已实现属性子集）');
 h=h.replace('<div class="v14-inlinebar" style="margin:14px 0">',`<div class="v15-note">选中工艺后，下面才展开对应组件；「重新套用方案」才会覆盖定制设置。</div><div class="v14-inlinebar" style="margin:14px 0">`);
 // additional method/case planning component cards are displayed when selected
 const more=w.lines.filter(k=>['method','case'].includes(k)).map(k=>{const c=craftByKeyV15(k);return `<div class="v14-config"><div class="v14-configtitle">${E(c.title)} · 待接入组件说明</div><div class="v15-technical"><div><b>目标执行组件</b>${E(c.primary)}</div><div><b>要补齐的契约和验证</b>${E(c.self)}</div></div></div>`}).join('');
 h=h.replace('<div class="hint">选择开源组件不等于已经接线。',more+'<div class="hint">选择开源组件不等于已经接线。')
 }
 return h;

// A plan using an unavailable real component may be saved for review, but cannot be represented as executed.
const originalRecipeCheckV14=recipeCheck;
recipeCheck=function(p,w){const current=ensureSettings(w);const keep={parser:current.common.parser,idx:current.evidence.index,rerank:current.evidence.rerank,extract:current.rule.extract,execute:current.rule.executor,mapping:current.facts.mapping};current.common.parser='demo';current.evidence.index='demo-hybrid';current.evidence.rerank='demo';current.rule.extract='demo';current.rule.executor='demo';current.facts.mapping='demo';const issue=originalRecipeCheckV14(p,w);Object.assign(current.common,{parser:keep.parser});Object.assign(current.evidence,{index:keep.idx,rerank:keep.rerank});Object.assign(current.rule,{extract:keep.extract,executor:keep.execute});Object.assign(current.facts,{mapping:keep.mapping});return issue};
const originalBuildProdV14=buildProd;
function unavailableForRunV15(p){const w=p.recipe,s=ensureSettings(w),missing=[];if(w.lines.some(k=>['method','case'].includes(k)))missing.push('流程方法/案例经验的实际加工和金标校验');if(s.common.parser!=='demo')missing.push('真实文档解析器 '+s.common.parser);if(w.lines.includes('evidence')&&(s.evidence.index!=='demo-hybrid'||s.evidence.rerank!=='demo'))missing.push('RAGFlow 检索适配器');if(w.lines.includes('rule')&&(s.rule.extract!=='demo'||s.rule.executor!=='demo'))missing.push('LLM 抽取 / Flowable DMN');if(w.lines.includes('facts')&&s.facts.mapping!=='demo')missing.push('权威业务数据映射');return missing}
buildProd=function(p){const missing=unavailableForRunV15(p);if(missing.length){toast('配方可作为技术规划保存，但实际生产尚未接入：'+missing.join('、'));return}originalBuildProdV14(p)};
